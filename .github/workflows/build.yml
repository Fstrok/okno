name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The Linux system (Debian + XFCE) takes ~30 min to build under qemu,
      # so it is rebuilt only when its recipe changes.
      - name: Cache Linux system image
        id: rootfs-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/rootfs.tgz
            app/src/main/assets/rootfs.version
            app/src/main/assets/okno-update.tgz
          key: rootfs-${{ hashFiles('scripts/build-rootfs.sh', 'scripts/fetch-rootfs.sh', 'scripts/build-proot.sh', 'scripts/xfconf-set.py', 'native/**', 'rootfs-overlay/**') }}

      - name: Build Linux system image
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static gtk-update-icon-cache libtalloc-dev uthash-dev gcc-aarch64-linux-gnu libx11-dev gcc-mingw-w64-x86-64-win32 gcc-mingw-w64-i686-win32
          scripts/build-proot.sh "$RUNNER_TEMP/proot"
          sudo env PROOT="$RUNNER_TEMP/proot/proot" scripts/build-rootfs.sh
          sudo chown -R "$(id -u):$(id -g)" app/src/main/assets

      - name: Build
        run: ./gradlew assembleDebug --console=plain

      - name: Rename APK
        run: |
          short=$(git rev-parse --short HEAD)
          mv app/build/outputs/apk/debug/app-debug.apk "okno-$short.apk"
          echo "APK=okno-$short.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: okno-apk
          path: ${{ env.APK }}
          compression-level: 0

      # Rolling pre-release: the newest build of main is always downloadable
      # as a plain .apk at Releases → "dev".
      - name: Publish dev release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev "$APK" --prerelease --target "$GITHUB_SHA" \
            --title "Okno dev ($(git rev-parse --short HEAD))" \
            --notes "Свежая сборка из main: ${COMMIT_MESSAGE:-ручной запуск}"
