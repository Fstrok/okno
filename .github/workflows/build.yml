name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Debian rootfs
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/rootfs.tgz
            app/src/main/assets/rootfs.version
          key: rootfs-${{ hashFiles('scripts/fetch-rootfs.sh') }}

      - name: Fetch Debian rootfs
        run: scripts/fetch-rootfs.sh

      - name: Build
        run: ./gradlew assembleDebug --console=plain

      - name: Rename APK
        run: |
          short=$(git rev-parse --short HEAD)
          mv app/build/outputs/apk/debug/app-debug.apk "okno-$short.apk"
          echo "APK=okno-$short.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: okno-apk
          path: ${{ env.APK }}
          compression-level: 0

      # Rolling pre-release: the newest build of main is always downloadable
      # as a plain .apk at Releases → "dev".
      - name: Publish dev release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev "$APK" --prerelease --target "$GITHUB_SHA" \
            --title "Okno dev ($(git rev-parse --short HEAD))" \
            --notes "Свежая сборка из main: ${COMMIT_MESSAGE:-ручной запуск}"
