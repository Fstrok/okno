# Okno: apps cannot bind ports below 1024 on Android, and PAM has nothing to
# talk to under proot. Root logs in with the password shown in the app.
Port 8022
PermitRootLogin yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
UsePAM no
PrintMotd no
# proot refuses prctl(PR_SET_DUMPABLE), which sftp-server insists on; the
# shim reports success (see native/nodumpable.c). Without SFTP, scp breaks too.
Subsystem sftp /usr/bin/env LD_PRELOAD=/usr/local/lib/libokno-nodumpable.so /usr/lib/openssh/sftp-server
